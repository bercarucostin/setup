name: setup
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  go_router: ^16.0.0
  font_awesome_flutter: ^10.8.0
  dio: ^5.3.0
  firebase_core: ^3.0.0
  firebase_auth: ^5.6.2
  flutter_svg: ^2.0.10
  google_sign_in: 6.3.0
  fl_chart: ^1.0.0
  cloud_firestore: ^5.6.11
  intl: ^0.18.1
  


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-VariableFont_wght.ttf
        