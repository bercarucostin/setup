name: Watt
description: "Align work and energy for higher productivity."
publish_to: 'none'
version: 1.0.2+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  flutter_svg: ^2.2.3
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0
  font_awesome_flutter: ^10.9.0
  go_router: ^14.2.7
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.6.11
  url_launcher: ^6.3.0
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.3
  intl: ^0.20.2
  firebase_remote_config: ^5.0.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon2.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#1E3A8A"
  adaptive_icon_foreground: "assets/icons/app_icon2.png"
  adaptive_icon_round: "assets/icons/app_icon2.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-VariableFont_wght.ttf
        - asset: assets/fonts/Montserrat-Bold.ttf
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
        - asset: assets/fonts/Montserrat-Light.ttf
        - asset: assets/fonts/Montserrat-SemiBold.ttf
